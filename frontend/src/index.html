<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClinicFlow</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<body>
  <app-root>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:'Inter',sans-serif;background:#F7F9F8;gap:16px;">
