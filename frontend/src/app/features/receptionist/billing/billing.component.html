<section class="billing">
  <h1>Billing</h1>

  <section class="picker-row" aria-label="Doctor and date filters">
    <label>
      <span>Doctor</span>
      <div class="input-with-icon">
        <span class="leading-icon" aria-hidden="true">person</span>
        <select class="form-input" [value]="selectedDoctorId()" (change)="onDoctorChange($any($event.target).value)">
          <option value="">Select doctor</option>
          <option *ngFor="let doctor of doctors()" [value]="doctor.id">{{ doctor.fullName }}</option>
        </select>
      </div>
    </label>

    <label>
      <span>Date</span>
      <div class="input-with-icon">
        <span class="leading-icon" aria-hidden="true">calendar_month</span>
        <input class="form-input" type="date" [value]="selectedDate()" (change)="onDateChange($any($event.target).value)" />
      </div>
    </label>
  </section>

  <div *ngIf="errorMessage() as message" class="message-banner error">
    <span class="banner-icon" aria-hidden="true">error</span>
    <span>{{ message }}</span>
  </div>

  <div *ngIf="successMessage() as message" class="message-banner success">
    <span class="banner-icon" aria-hidden="true">check_circle</span>
    <span>{{ message }}</span>
  </div>

  <section class="appointments-panel" *ngIf="schedule() as scheduleData">
    <h2>Booked Appointments</h2>

    <div class="appointments-list" *ngIf="scheduleData.bookedSlots.length > 0; else noAppointments">
      <article
        class="appointment-card"
        *ngFor="let appointment of scheduleData.bookedSlots"
        [ngClass]="'status-' + appointment.status.toLowerCase()"
      >
        <div class="appointment-header">
          <div class="appointment-time">
            <span class="time-icon" aria-hidden="true">schedule</span>
            <span>{{ appointment.start | date: 'shortTime':'UTC' }} → {{ appointment.end | date: 'shortTime':'UTC' }}</span>
          </div>
          <span class="status-badge" [ngClass]="appointment.status.toLowerCase()">{{ appointment.status }}</span>
        </div>

        <div class="appointment-actions">
          <button
            *ngIf="appointment.status === 'Completed' && !appointment.hasPayment"
            class="action-button record"
            type="button"
            (click)="openPaymentForm(appointment.appointmentId)"
          >
            <span class="btn-icon" aria-hidden="true">payments</span>
            <span>Record Payment</span>
          </button>

          <span *ngIf="appointment.status === 'Completed' && appointment.hasPayment" class="paid-label">
            <span class="paid-icon" aria-hidden="true">check_circle</span>
            <span>Paid</span>
          </span>

          <form
            *ngIf="payingAppointmentId() === appointment.appointmentId"
            class="payment-form-card"
            [formGroup]="paymentForm"
            (ngSubmit)="submitPayment(appointment.appointmentId)"
          >
            <label>
              <span>Amount</span>
              <div class="input-with-icon">
                <span class="leading-icon" aria-hidden="true">currency_rupee</span>
                <input class="form-input" type="number" formControlName="amount" min="1" />
              </div>
            </label>

            <label>
              <span>Method</span>
              <div class="input-with-icon">
                <span class="leading-icon" aria-hidden="true">payments</span>
                <select class="form-input" formControlName="method">
                  <option value="">Select method</option>
                  <option value="Cash">Cash</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </label>

            <button class="submit-button" type="submit" [disabled]="paymentForm.invalid">
              Submit Payment
            </button>
          </form>
        </div>
      </article>
    </div>

    <ng-template #noAppointments>
      <div class="appointments-empty-state">
        <span class="empty-icon" aria-hidden="true">receipt_long</span>
        <p>No booked appointments found</p>
      </div>
    </ng-template>
  </section>
</section>
