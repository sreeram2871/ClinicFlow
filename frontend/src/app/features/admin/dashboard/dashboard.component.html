<h1>Dashboard</h1>
<p>Welcome, {{ fullName() }}</p>

@if (summary()) {
  <section class="stats-grid">
    <app-stat-card
      label="Appointments Today"
      [value]="summary()!.appointmentsToday.toString()"
      color="#3C3489"
    ></app-stat-card>

    <app-stat-card
      label="Revenue This Month"
      [value]="'Rs. ' + summary()!.revenueThisMonth"
      color="#0F6E56"
    ></app-stat-card>

    <app-stat-card
      label="Total Patients"
      [value]="summary()!.totalPatients.toString()"
      color="#0C447C"
    ></app-stat-card>
  </section>
}

<section class="charts-grid">
  <app-chart-card
    title="Revenue Trend (Last 6 Weeks)"
    [dataPoints]="summary()?.revenueByWeek ?? []"
    chartType="line"
  ></app-chart-card>

  <app-chart-card
    title="New Patients Per Week"
    [dataPoints]="summary()?.newPatientsByWeek ?? []"
    chartType="bar"
  ></app-chart-card>
</section>

@if (staffList().length > 0) {
  <section class="staff-panel">
    <h2>Staff</h2>

    @for (staffMember of staffList(); track staffMember.id) {
      <div class="staff-row">
        <span>{{ staffMember.fullName }}</span>
        <span>{{ staffMember.role }}</span>
        <span>{{ staffMember.isActive ? 'Active' : 'Inactive' }}</span>
      </div>
    }
  </section>
} @else {
  <p>No staff found</p>
}
