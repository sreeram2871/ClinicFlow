<main class="register-page">
  <section class="register-card" aria-label="Patient registration form">
    <h1 class="form-heading">
      <mat-icon>person_add</mat-icon>
      Register as patient
    </h1>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <label>
        <span>Full Name</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">badge</mat-icon>
          <input class="form-input" type="text" formControlName="fullName" />
        </div>
      </label>

      <label>
        <span>Email</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">email</mat-icon>
          <input class="form-input" type="email" formControlName="email" />
        </div>
      </label>

      <label>
        <span>Password</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">lock</mat-icon>
          <input class="form-input" type="password" formControlName="password" />
        </div>
      </label>

      <label>
        <span>Phone</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">phone</mat-icon>
          <input class="form-input" type="tel" formControlName="phone" />
        </div>
      </label>

      <label>
        <span>Date of Birth</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">cake</mat-icon>
          <input class="form-input" type="date" formControlName="dateOfBirth" />
        </div>
      </label>

      <button class="submit-button" type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="button-spinner" aria-hidden="true"></span>
          <span>Creating account...</span>
        } @else {
          <mat-icon>check_circle</mat-icon>
          <span>Create Account</span>
        }
      </button>
    </form>

    @if (errorMessage()) {
      <div class="message-banner error">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="message-banner success">
        <mat-icon>check_circle</mat-icon>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <a class="login-link" routerLink="/login">Already have an account? Login</a>
  </section>
</main>
