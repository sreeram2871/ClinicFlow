<main class="register-page">
  <section class="register-card" aria-label="Patient registration form">
    <h1 class="form-heading">
      <mat-icon>person_add</mat-icon>
      Register as patient
    </h1>

    <form class="register-form" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <label>
        <span>Full Name</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">badge</mat-icon>
          <input
            class="form-input"
            type="text"
            formControlName="fullName"
            [class.invalid]="registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched"
          />
        </div>
        @if (registerForm.get('fullName')?.invalid && registerForm.get('fullName')?.touched) {
          <span class="field-error">Full name is required.</span>
        }
      </label>

      <label>
        <span>Email</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">email</mat-icon>
          <input
            class="form-input"
            type="email"
            formControlName="email"
            [class.invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
          />
        </div>
        @if (registerForm.get('email')?.invalid && registerForm.get('email')?.touched) {
          <span class="field-error">Enter a valid email address.</span>
        }
      </label>

      <label>
        <span>Password</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">lock</mat-icon>
          <input
            class="form-input"
            type="password"
            formControlName="password"
            [class.invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
          />
        </div>
        @if (registerForm.get('password')?.invalid && registerForm.get('password')?.touched) {
          <span class="field-error">Password must be at least 8 characters.</span>
        }
      </label>

      <label>
        <span>Phone</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">phone</mat-icon>
          <input
            class="form-input"
            type="tel"
            formControlName="phone"
            [class.invalid]="registerForm.get('phone')?.invalid && registerForm.get('phone')?.touched"
          />
        </div>
        @if (registerForm.get('phone')?.invalid && registerForm.get('phone')?.touched) {
          <span class="field-error">Phone number is required.</span>
        }
      </label>

      <label>
        <span>Date of Birth</span>
        <div class="input-with-icon">
          <mat-icon class="leading-icon">cake</mat-icon>
          <input
            class="form-input"
            type="date"
            formControlName="dateOfBirth"
            [class.invalid]="registerForm.get('dateOfBirth')?.invalid && registerForm.get('dateOfBirth')?.touched"
          />
        </div>
        @if (registerForm.get('dateOfBirth')?.invalid && registerForm.get('dateOfBirth')?.touched && registerForm.get('dateOfBirth')?.errors?.['required']) {
          <span class="field-error">Date of birth is required.</span>
        }
        @if (registerForm.get('dateOfBirth')?.errors?.['notPastDate'] && registerForm.get('dateOfBirth')?.touched) {
          <span class="field-error">Date of birth must be in the past.</span>
        }
      </label>

      <button class="submit-button" type="submit" [disabled]="isSubmitting()">
        @if (isSubmitting()) {
          <span class="button-spinner" aria-hidden="true"></span>
          <span>Creating account...</span>
        } @else {
          <mat-icon>check_circle</mat-icon>
          <span>Create Account</span>
        }
      </button>
    </form>

    @if (errorMessage()) {
      <div class="message-banner error">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="message-banner success">
        <mat-icon>check_circle</mat-icon>
        <span>{{ successMessage() }}</span>
      </div>
    }

    <a class="login-link" routerLink="/login">Already have an account? Login</a>
  </section>
</main>
